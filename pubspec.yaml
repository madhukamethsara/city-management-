name: smart_sabha
description: A mobile-first civic engagement frontend for Sri Lankan local authorities.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.15.4

dev_dependencies:
  http: ^1.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
